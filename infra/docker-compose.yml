services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zorya
      POSTGRES_DB: zorya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zorya"]
      interval: 5s
      retries: 10
  api:
    build: ../services/astro-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://zorya:${POSTGRES_PASSWORD}@db:5432/zorya
      ENVIRONMENT: production
    volumes: ["apidata:/data"]
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    # Caddyfile reads {$API_DOMAIN}; without this the container doesn't see
    # it and silently falls back to the `api.localhost` default, issuing a
    # self-signed local cert instead of a real Let's Encrypt one.
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api]
volumes: {pgdata: {}, apidata: {}, caddydata: {}}
